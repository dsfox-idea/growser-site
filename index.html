<style>
  :root { --blue:#3DA9FC; --ink:#eaf2ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 800px at 70% -10%, #4b2a72 0%, #2a1b46 45%, #140f24 100%);
    min-height:100%; display:flex; align-items:center; justify-content:center;

  h1 { font-size: clamp(40px, 9vw, 84px); font-weight:800; letter-spacing:-.02em; }
  .tag { margin-top:14px; font-size: clamp(15px,3.5vw,20px); color:#b9c4e6; font-weight:500; }
  .soon { margin-top:34px; display:inline-flex; align-items:center; gap:10px;
    font-size:14px; letter-spacing:.18em; text-transform:uppercase; color:#9fb0da; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--blue);
    box-shadow:0 0 0 0 rgba(61,169,252,.6); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(61,169,252,.55)} 70%{box-shadow:0 0 0 14px rgba(61,169,252,0)} 100%{box-shadow:0 0 0 0 rgba(61,169,252,0)} }
  .foot { position:fixed; bottom:22px; left:0; right:0; font-size:12px; color:#7f8bb0; }
</style>
