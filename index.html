  html,body { height:100%; }
  body {

    color: var(--ink);

    filter: drop-shadow(0 10px 46px rgba(30,163,98,.55)); animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  h1 { font-size: clamp(40px, 9vw, 84px); font-weight:800; letter-spacing:-.02em; }
  h1 .g { color: var(--green); }
  .tag { margin-top:14px; font-size: clamp(15px,3.5vw,20px); color:#b9c4e6; font-weight:500; }
  .soon { margin-top:36px; display:inline-flex; align-items:center; gap:10px;
    font-size:14px; letter-spacing:.18em; text-transform:uppercase; color:#9fb0da; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--green-bright);
    box-shadow:0 0 0 0 rgba(47,208,127,.6); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(47,208,127,.55)} 70%{box-shadow:0 0 0 14px rgba(47,208,127,0)} 100%{box-shadow:0 0 0 0 rgba(47,208,127,0)} }
  .foot { position:fixed; bottom:22px; left:0; right:0; z-index:1; font-size:12px; color:#7f8bb0; }
